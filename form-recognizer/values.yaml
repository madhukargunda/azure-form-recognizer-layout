replicaCount: 1

image:
  repository: mcr.microsoft.com/azure-cognitive-services/form-recognizer/layout-3.1
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000
  annotations: {}
  labels: {}

env:
  - name: eula
    value: accept
  - name: Logging:Console:LogLevel:Default
    value: Information
  - name: SharedRootFolder
    value: /share
  - name: Mounts:Shared
    value: /share
  - name: Mounts:Output
    value: /logs

proxyEnv: {}

caCertConfigMap:
  name: ""
  mountPath: /etc/ssl/certs/custom
  items: []

secret:
  create: true
  nameOverride: ""

secretEnv:
  apikey: ""
  billing: ""

config:
  create: false
  nameOverride: ""
  data: {}

volumeMounts:
  - name: shared
    mountPath: /share
  - name: output
    mountPath: /logs

persistence:
  shared:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
  output:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""

probes:
  readiness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 6
  httpGet:
    path: /
    scheme: HTTP

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

imagePullSecrets: []
