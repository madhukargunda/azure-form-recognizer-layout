apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "azure-docintel-layout.fullname" . }}
  labels:
    {{- include "azure-docintel-layout.labels" . | nindent 4 }}
    app: {{ .Values.labels.app | quote }}
    component: {{ .Values.labels.component | quote }}
    function: {{ .Values.labels.function | quote }}
    env: {{ .Values.labels.env | quote }}
    appcode: {{ .Values.labels.appcode | quote }}
    tier: {{ .Values.labels.tier | quote }}
    opscontact: {{ .Values.labels.opscontact | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "azure-docintel-layout.selectorLabels" . | nindent 6 }}
      app: {{ .Values.labels.app | quote }}
      component: {{ .Values.labels.component | quote }}
      function: {{ .Values.labels.function | quote }}
      env: {{ .Values.labels.env | quote }}
      appcode: {{ .Values.labels.appcode | quote }}
      tier: {{ .Values.labels.tier | quote }}
      opscontact: {{ .Values.labels.opscontact | quote }}
  template:
    metadata:
      labels:
        {{- include "azure-docintel-layout.selectorLabels" . | nindent 8 }}
        app: {{ .Values.labels.app | quote }}
        component: {{ .Values.labels.component | quote }}
        function: {{ .Values.labels.function | quote }}
        env: {{ .Values.labels.env | quote }}
        appcode: {{ .Values.labels.appcode | quote }}
        tier: {{ .Values.labels.tier | quote }}
        opscontact: {{ .Values.labels.opscontact | quote }}
      annotations:
        com.illumio.app: {{ .Values.annotations.illumioApp | quote }}
        role: {{ .Values.annotations.role | quote }}
        env: {{ .Values.annotations.env | quote }}
        lo: {{ .Values.annotations.lo | quote }}
        app-tiers.middleware: {{ .Values.annotations.appTiersMiddleware | quote }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: layout
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # Environment variables from values.yaml
            # These can include special characters like colons
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            # Load secrets from pre-existing or Helm-created secret
            {{- if .Values.secret.externalSecretName }}
            - name: apikey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.externalSecretName }}
                  key: apikey
            - name: billing
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.externalSecretName }}
                  key: billing
            {{- else if or .Values.secret.create .Values.secret.nameOverride }}
            {{- if .Values.secretEnv.apikey }}
            - name: apikey
              valueFrom:
                secretKeyRef:
                  name: {{ include "azure-docintel-layout.secretName" . }}
                  key: apikey
            {{- end }}
            {{- if .Values.secretEnv.billing }}
            - name: billing
              valueFrom:
                secretKeyRef:
                  name: {{ include "azure-docintel-layout.secretName" . }}
                  key: billing
            {{- end }}
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.shared.enabled }}
            - name: shared
              mountPath: /share
            {{- end }}
            {{- if .Values.persistence.output.enabled }}
            - name: output
              mountPath: /logs
            {{- end }}
            {{- if and .Values.tlsCertSecret .Values.tlsCertSecret.name }}
            - name: tls-cert
              mountPath: {{ .Values.tlsCertSecret.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.caCertConfigMap .Values.caCertConfigMap.name }}
            - name: ca-cert
              mountPath: {{ .Values.caCertConfigMap.mountPath }}
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- if eq .Values.probes.readiness.type "httpGet" }}
            httpGet:
              path: {{ .Values.probes.httpGet.path }}
              port: {{ .Values.service.targetPort }}
              scheme: {{ .Values.probes.httpGet.scheme }}
            {{- else }}
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- if eq .Values.probes.liveness.type "httpGet" }}
            httpGet:
              path: {{ .Values.probes.httpGet.path }}
              port: {{ .Values.service.targetPort }}
              scheme: {{ .Values.probes.httpGet.scheme }}
            {{- else }}
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.shared.enabled }}
        - name: shared
          persistentVolumeClaim:
            claimName: {{ include "azure-docintel-layout.pvcName" (dict "root" . "volume" (dict "name" "shared")) }}
        {{- end }}
        {{- if .Values.persistence.output.enabled }}
        - name: output
          persistentVolumeClaim:
            claimName: {{ include "azure-docintel-layout.pvcName" (dict "root" . "volume" (dict "name" "output")) }}
        {{- end }}
        {{- if and .Values.tlsCertSecret .Values.tlsCertSecret.name }}
        - name: tls-cert
          secret:
            secretName: {{ .Values.tlsCertSecret.name }}
            {{- if .Values.tlsCertSecret.items }}
            items:
              {{- toYaml .Values.tlsCertSecret.items | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- if and .Values.caCertConfigMap .Values.caCertConfigMap.name }}
        - name: ca-cert
          configMap:
            name: {{ .Values.caCertConfigMap.name }}
            {{- if .Values.caCertConfigMap.items }}
            items:
              {{- toYaml .Values.caCertConfigMap.items | nindent 14 }}
            {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

